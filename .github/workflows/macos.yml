name: macOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:              # 由 release.yml 在推 v* 標籤時呼叫

permissions:
  contents: write            # 建立/更新 Release 需要

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install build dependencies
      run: brew install ninja

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qt5compat'      # 提供 Core5Compat

    - name: Configure CMake
      # Universal（Apple Silicon + Intel）：同一份 DMG 兩種 Mac 都能用
      run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

    - name: Build
      run: cmake --build build

    - name: Run unit tests
      run: ctest --test-dir build --output-on-failure

    # 每次都打包並做煙霧測試，確保打包流程不會壞掉；只有推 v* 標籤才上傳到 Release
    - name: Package DMG
      run: |
        VER="${GITHUB_REF_NAME}"
        [[ "$GITHUB_REF" == refs/tags/* ]] || VER="dev-${GITHUB_SHA::7}"
        scripts/package-macos.sh build "$VER" dist

    - name: Smoke test DMG (without the build Qt)
      run: |
        set -x
        DMG=$(ls dist/*.dmg)
        MNT=$(mktemp -d)
        hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
        cp -R "$MNT/AlexCode.app" "$RUNNER_TEMP/"
        hdiutil detach "$MNT" -quiet
        APP="$RUNNER_TEMP/AlexCode.app"
        lipo -archs "$APP/Contents/MacOS/AlexCode"
        otool -L "$APP/Contents/MacOS/AlexCode" | grep -i qt
        # 暫時移走建置用的 Qt，確認 DMG 內的 app 完全自帶 Qt
        mv "$QT_ROOT_DIR" "$QT_ROOT_DIR.hidden"
        "$APP/Contents/MacOS/AlexCode" --about-shot "$RUNNER_TEMP/about.png"
        RC=$?
        mv "$QT_ROOT_DIR.hidden" "$QT_ROOT_DIR"
        test $RC -eq 0 && test -s "$RUNNER_TEMP/about.png"

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v7
      continue-on-error: true
      with:
        name: AlexCode-macOS
        path: dist/*.dmg
        retention-days: 5

    - name: Upload to draft release
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      # 草稿由 release.yml 建立；Release 為不可變（immutable），發佈後無法再上傳，故全平台上傳完才發佈
      run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber -R "$GITHUB_REPOSITORY"