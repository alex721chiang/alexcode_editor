# 推 v* 標籤：先建立草稿 Release → 三個平台各自建置、測試並上傳安裝檔 → 全部成功才發佈。
# 本 repo 的 Release 為不可變（immutable）：發佈後無法再加檔案，
# 若各平台自行建立/發佈，最先完成者會發佈 Release，其餘平台上傳即被拒。
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "AlexCode $GITHUB_REF_NAME" --generate-notes

  windows:
    needs: draft
    uses: ./.github/workflows/windows.yml
  macos:
    needs: draft
    uses: ./.github/workflows/macos.yml
  linux:
    needs: draft
    uses: ./.github/workflows/linux.yml

  publish:
    needs: [ windows, macos, linux ]
    runs-on: ubuntu-latest
    steps:
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
