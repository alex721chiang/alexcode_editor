name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:              # 由 release.yml 在推 v* 標籤時呼叫

permissions:
  contents: write            # 建立 Release 需要

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'          # 6.8：對應 arch 為 msvc2022_64；舊版 6.5.x 的標頭用到已被新 MSVC 移除的 stdext，無法編譯
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qt5compat'      # 提供 Core5Compat（QTextCodec 等），CMake find_package 需要

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Run unit tests
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Deploy Qt Dependencies
      run: |
        # The executable is generated inside the Release folder when using --config Release
        windeployqt --release --no-translations --compiler-runtime build/src/Release/AlexCode.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      continue-on-error: true        # 工件儲存配額用罄等基礎設施問題不應讓建置變紅（建置/測試已通過）
      with:
        name: AlexCode-Windows
        path: build/src/Release/
        retention-days: 5            # 縮短保留期，避免每次 push 累積佔滿配額

    # 以下僅在推 v* 標籤時執行：打包 zip 並建立 GitHub Release
    - name: Package zip
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force dist | Out-Null
        Compress-Archive -Path build/src/Release/* -DestinationPath "dist/AlexCode-Windows-${{ github.ref_name }}.zip"

    - name: Build Installer (Inno Setup)
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        $ver = "${{ github.ref_name }}".TrimStart('v')
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
        if (-not (Test-Path $iscc)) {
          $iscc = (Get-ChildItem 'C:\Program Files (x86)','C:\Program Files' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
        }
        & $iscc "/DMyAppVersion=$ver" "/DDeployDir=$((Resolve-Path build/src/Release).Path)" "/DOutDir=$((Resolve-Path dist).Path)" installer/AlexCode.iss

    - name: Upload to draft release
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      # 草稿由 release.yml 建立；Release 為不可變（immutable），發佈後無法再上傳，故全平台上傳完才發佈
      run: gh release upload "$GITHUB_REF_NAME" dist/AlexCode-Windows-"$GITHUB_REF_NAME".zip dist/AlexCode-Setup-*.exe --clobber -R "$GITHUB_REPOSITORY"

  # MinGW 建置：對齊本機開發工具鏈（Qt 6.8.3 + MinGW 13.1 + Ninja）。
  # MSVC 能過但 MinGW 編不過的程式碼（如 std::thread::native_handle() 轉 HANDLE）
  # 只有這個 job 抓得到；不打包、不發佈，純建置+測試。
  build-mingw:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Qt (MinGW)
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        modules: 'qt5compat'
        tools: 'tools_mingw1310 tools_ninja'

    - name: Configure CMake
      shell: pwsh
      run: |
        $env:PATH = "$env:IQTA_TOOLS\mingw1310_64\bin;$env:IQTA_TOOLS\Ninja;" + $env:PATH
        cmake -B build-mingw -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: pwsh
      run: |
        $env:PATH = "$env:IQTA_TOOLS\mingw1310_64\bin;$env:IQTA_TOOLS\Ninja;" + $env:PATH
        cmake --build build-mingw

    - name: Run unit tests
      shell: pwsh
      run: |
        $env:PATH = "$env:IQTA_TOOLS\mingw1310_64\bin;$env:IQTA_TOOLS\Ninja;" + $env:PATH
        ctest --test-dir build-mingw --output-on-failure
