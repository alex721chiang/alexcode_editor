name: Windows Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]            # 推 v* 標籤時建立 Release
  pull_request:
    branches: [ main ]

permissions:
  contents: write            # 建立 Release 需要

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'          # 6.8：對應 arch 為 msvc2022_64；舊版 6.5.x 的標頭用到已被新 MSVC 移除的 stdext，無法編譯
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qt5compat'      # 提供 Core5Compat（QTextCodec 等），CMake find_package 需要

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Run unit tests
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Deploy Qt Dependencies
      run: |
        # The executable is generated inside the Release folder when using --config Release
        windeployqt --release --no-translations --compiler-runtime build/src/Release/AlexCode.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      continue-on-error: true        # 工件儲存配額用罄等基礎設施問題不應讓建置變紅（建置/測試已通過）
      with:
        name: AlexCode-Windows
        path: build/src/Release/
        retention-days: 5            # 縮短保留期，避免每次 push 累積佔滿配額

    # 以下僅在推 v* 標籤時執行：打包 zip 並建立 GitHub Release
    - name: Package zip
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force dist | Out-Null
        Compress-Archive -Path build/src/Release/* -DestinationPath "dist/AlexCode-Windows-${{ github.ref_name }}.zip"

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/AlexCode-Windows-${{ github.ref_name }}.zip
        generate_release_notes: true
