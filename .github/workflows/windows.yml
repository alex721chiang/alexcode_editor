name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'          # 6.8：對應 arch 為 msvc2022_64；舊版 6.5.x 的標頭用到已被新 MSVC 移除的 stdext，無法編譯
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qt5compat'      # 提供 Core5Compat（QTextCodec 等），CMake find_package 需要

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Run unit tests
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Deploy Qt Dependencies
      run: |
        # The executable is generated inside the Release folder when using --config Release
        windeployqt --release --no-translations --compiler-runtime build/src/Release/AlexCode.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlexCode-Windows
        path: build/src/Release/
