# 暫時的診斷工作：Windows 崩潰時的呼叫堆疊（修正後移除）
name: Diag Windows crash
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  mingw:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: jurplel/install-qt-action@v4
      with: { version: '6.8.3', host: 'windows', target: 'desktop', arch: 'win64_mingw', modules: 'qt5compat', tools: 'tools_mingw1310 tools_ninja' }
    - name: Build and debug
      shell: bash
      run: |
        export PATH="$IQTA_TOOLS/mingw1310_64/bin:$IQTA_TOOLS/Ninja:$QT_ROOT_DIR/bin:$PATH"
        mkdir -p ci-logs
        cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo > ci-logs/configure.log 2>&1 || true
        cmake --build build --target AlexCodeWidgetTests > ci-logs/build.log 2>&1; echo "build=$?" >> ci-logs/RESULT.txt
        set +e
        T=build/tests/AlexCodeWidgetTests.exe
        F='SingleInstanceTest.MainWindowOpensReceivedFilesAsTabs:FindInFilesDialogTest.SearchRunsInBackground'
        timeout 600 $T --gtest_filter="$F" > ci-logs/pair.log 2>&1; echo "pair=$?" >> ci-logs/RESULT.txt
        timeout 900 $T > ci-logs/full.log 2>&1; echo "full=$?" >> ci-logs/RESULT.txt
    - name: Publish
      if: always()
      shell: bash
      run: |
        mkdir -p ci-logs && cd ci-logs && git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
        git checkout -q -b ci-diag-mingw && git add -A && git commit -qm "diag mingw ${GITHUB_SHA}"
        git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-diag-mingw
  msvc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: jurplel/install-qt-action@v4
      with: { version: '6.8.3', host: 'windows', target: 'desktop', arch: 'win64_msvc2022_64', modules: 'qt5compat' }
    - name: Build and debug
      shell: bash
      run: |
        mkdir -p ci-logs
        cmake -B build -S . > ci-logs/configure.log 2>&1 || true
        cmake --build build --config RelWithDebInfo --target AlexCodeWidgetTests > ci-logs/build.log 2>&1; echo "build=$?" >> ci-logs/RESULT.txt
        set +e
        T=build/tests/RelWithDebInfo/AlexCodeWidgetTests.exe
        export PATH="$QT_ROOT_DIR/bin:$PATH"
        F='SingleInstanceTest.MainWindowOpensReceivedFilesAsTabs:FindInFilesDialogTest.SearchRunsInBackground'
        timeout 600 $T --gtest_filter="$F" > ci-logs/pair.log 2>&1; echo "pair=$?" >> ci-logs/RESULT.txt
        timeout 900 $T > ci-logs/full.log 2>&1; echo "full=$?" >> ci-logs/RESULT.txt
    - name: Publish
      if: always()
      shell: bash
      run: |
        mkdir -p ci-logs && cd ci-logs && git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
        git checkout -q -b ci-diag-msvc && git add -A && git commit -qm "diag msvc ${GITHUB_SHA}"
        git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-diag-msvc
