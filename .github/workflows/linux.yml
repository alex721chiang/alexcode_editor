name: Linux Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]            # 推 v* 標籤時把 AppImage 上傳到 Release
  pull_request:
    branches: [ main ]

permissions:
  contents: write            # 建立/更新 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install build dependencies
      # libxcb-*：Qt xcb 平台外掛的相依，AppImage 打包時必須存在才能一併收進去
      run: >
        sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev
        libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
        libxcb-xkb1 libxkbcommon-x11-0 libxcb-shape0 libxcb-randr0 libxcb-sync1 libxcb-xfixes0 libxcb-shm0

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qt5compat'      # 提供 Core5Compat

    - name: Configure CMake
      run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Run unit tests
      run: ctest --test-dir build --output-on-failure

    # 每次都打包並做煙霧測試；只有推 v* 標籤才上傳到 Release
    - name: Package AppImage
      run: |
        VER="${GITHUB_REF_NAME}"
        [[ "$GITHUB_REF" == refs/tags/* ]] || VER="dev-${GITHUB_SHA::7}"
        QMAKE="$QT_ROOT_DIR/bin/qmake" scripts/package-linux.sh build "$VER" dist

    - name: Smoke test AppImage (without the build Qt)
      run: |
        set -x
        IMG=$(ls dist/*.AppImage)
        mv "$QT_ROOT_DIR" "$QT_ROOT_DIR.hidden"            # 確認 AppImage 完全自帶 Qt
        QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 "$IMG" --about-shot "$RUNNER_TEMP/about.png"
        RC=$?
        mv "$QT_ROOT_DIR.hidden" "$QT_ROOT_DIR"
        test $RC -eq 0 && test -s "$RUNNER_TEMP/about.png"

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v7
      continue-on-error: true
      with:
        name: AlexCode-Linux
        path: dist/*.AppImage
        retention-days: 5

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.AppImage
