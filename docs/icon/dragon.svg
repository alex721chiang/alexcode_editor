<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#1a2440"/>
      <stop offset="0.6" stop-color="#101828"/>
      <stop offset="1" stop-color="#080c14"/>
    </radialGradient>
    <linearGradient id="goldBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#f2b632"/>
      <stop offset="1" stop-color="#c08020"/>
    </linearGradient>
    <linearGradient id="goldHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset="0.6" stop-color="#f2b632"/>
      <stop offset="1" stop-color="#d0902a"/>
    </linearGradient>
    <radialGradient id="pearl" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#fff7e0"/>
      <stop offset="0.45" stop-color="#ffd05e"/>
      <stop offset="0.8" stop-color="#f0632a"/>
      <stop offset="1" stop-color="#b23315"/>
    </radialGradient>
  </defs>

  <!-- 背景（深夜藍 + 金環） -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="url(#bgGlow)"/>
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="#8a6a20" stroke-width="6"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="#f2b632" stroke-width="2" opacity="0.5"/>

  <!-- 龍身（蟠繞主曲線；頭端稍細營造頸部） -->
  <path d="M 372 226 C 448 262, 436 366, 352 406 C 262 450, 142 432, 102 352 C 74 292, 102 232, 152 207"
        fill="none" stroke="#7a4d10" stroke-width="46" stroke-linecap="round"/>
  <path d="M 372 226 C 448 262, 436 366, 352 406 C 262 450, 142 432, 102 352 C 74 292, 102 232, 152 207"
        fill="none" stroke="url(#goldBody)" stroke-width="38" stroke-linecap="round"/>
  <!-- 腹甲（節狀） -->
  <path d="M 372 226 C 448 262, 436 366, 352 406 C 262 450, 142 432, 102 352 C 74 292, 102 232, 152 207"
        fill="none" stroke="#fff0b8" stroke-width="13" stroke-linecap="butt"
        stroke-dasharray="9 7" opacity="0.85"/>

  <!-- 背鰭（沿外緣的火焰刺） -->
  <g fill="#c98a1d">
    <path d="M 400 250 q 26 -12 36 6 q -20 2 -24 18 z"/>
    <path d="M 424 300 q 28 -2 28 18 q -18 -2 -28 10 z"/>
    <path d="M 410 358 q 24 8 16 26 q -14 -8 -26 -2 z"/>
    <path d="M 362 402 q 14 14 2 28 q -10 -12 -22 -10 z"/>
    <path d="M 290 436 q 6 18 -8 26 q -6 -14 -18 -16 z"/>
    <path d="M 205 444 q -2 20 -18 22 q 0 -14 -10 -22 z"/>
    <path d="M 128 408 q -10 18 -28 12 q 6 -12 0 -22 z"/>
    <path d="M 84 332 q -18 4 -26 -10 q 12 -6 14 -18 z"/>
    <path d="M 94 256 q -18 -6 -16 -22 q 14 2 22 -6 z"/>
  </g>

  <!-- 尾部火焰穗（三股羽狀） -->
  <g>
    <path d="M 156 212 C 128 196, 118 172, 128 142 C 136 164, 148 172, 162 170 C 150 184, 150 198, 162 206 z" fill="#f2b632"/>
    <path d="M 158 206 C 140 190, 138 172, 148 154 C 152 168, 162 174, 172 172 C 162 184, 162 196, 170 202 z" fill="#ffd968"/>
    <path d="M 150 214 C 128 214, 112 204, 104 186 C 118 190, 130 186, 136 178 C 136 192, 142 204, 154 208 z" fill="#e0a72a"/>
  </g>

  <!-- 前腿（自軀幹前段伸向珠，爪張開） -->
  <path d="M 396 296 C 376 322, 344 336, 308 336" fill="none" stroke="#7a4d10" stroke-width="24" stroke-linecap="round"/>
  <path d="M 396 296 C 376 322, 344 336, 308 336" fill="none" stroke="url(#goldBody)" stroke-width="17" stroke-linecap="round"/>
  <g fill="#ffe9a8" stroke="#7a4d10" stroke-width="2.5">
    <path d="M 308 336 C 293 331, 281 333, 273 341 C 284 343, 291 347, 295 353 z"/>
    <path d="M 308 336 C 297 343, 292 353, 294 365 C 300 356, 308 352, 316 352 z"/>
    <path d="M 311 340 C 314 354, 322 362, 334 363 C 328 355, 326 347, 328 339 z"/>
  </g>

  <!-- 後腿（自下彎處向下，爪撐地） -->
  <path d="M 208 428 C 214 448, 228 460, 248 464" fill="none" stroke="#7a4d10" stroke-width="22" stroke-linecap="round"/>
  <path d="M 208 428 C 214 448, 228 460, 248 464" fill="none" stroke="url(#goldBody)" stroke-width="15" stroke-linecap="round"/>
  <g fill="#ffe9a8" stroke="#7a4d10" stroke-width="2.5">
    <path d="M 248 464 C 262 458, 274 458, 284 464 C 272 468, 264 474, 260 480 z"/>
    <path d="M 248 464 C 254 474, 254 484, 248 492 C 244 482, 238 476, 230 474 z"/>
    <path d="M 244 462 C 234 470, 222 472, 212 468 C 220 462, 224 456, 224 448 z"/>
  </g>

  <!-- ===== 龍首（面向左，朝向龍珠） ===== -->
  <!-- 鬃毛（腦後火焰髮，四綹） -->
  <g>
    <path d="M 372 150 C 414 122, 456 122, 480 150 C 452 146, 430 156, 420 176 C 410 158, 392 150, 372 150 z" fill="#d99a25"/>
    <path d="M 382 182 C 426 168, 462 180, 474 210 C 448 198, 426 204, 414 222 C 406 202, 396 190, 382 182 z" fill="#eab440"/>
    <path d="M 384 214 C 424 210, 452 226, 458 254 C 436 240, 416 242, 404 256 C 400 238, 394 224, 384 214 z" fill="#d99a25"/>
    <path d="M 378 244 C 410 248, 428 266, 428 290 C 412 274, 396 272, 384 280 C 384 264, 382 252, 378 244 z" fill="#eab440"/>
  </g>

  <!-- 角（鹿角，雙叉，向後上方） -->
  <g stroke="#e8c04a" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M 344 148 C 352 118, 374 98, 406 92"/>
    <path d="M 368 118 C 380 110, 396 110, 408 118"/>
  </g>
  <g stroke="#d0a030" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M 322 146 C 322 120, 334 100, 356 88"/>
    <path d="M 334 116 C 344 108, 356 106, 366 110"/>
  </g>

  <!-- 頭部主體（加長吻部、額頭隆起、後腦寬） -->
  <path d="M 228 158
           C 244 146, 268 142, 292 146
           C 306 136, 330 132, 350 138
           C 376 146, 390 168, 388 192
           C 386 216, 374 234, 354 242
           C 336 249, 318 246, 306 236
           L 296 226
           C 268 224, 244 214, 232 200
           C 222 188, 222 170, 228 158 z"
        fill="url(#goldHead)" stroke="#7a4d10" stroke-width="5"/>

  <!-- 鼻端（獅鼻上翹 + 鼻孔捲曲） -->
  <path d="M 234 160 C 220 152, 214 138, 222 124 C 232 132, 242 134, 252 132 C 246 142, 242 152, 242 162 z"
        fill="#f2b632" stroke="#7a4d10" stroke-width="4"/>
  <path d="M 230 152 q -9 -7 -6 -16" fill="none" stroke="#7a4d10" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 口（張口：上顎下緣 → 口腔 → 下顎） -->
  <path d="M 232 200 C 248 205, 268 208, 292 208 L 302 234 C 284 239, 262 234, 246 224 C 236 217, 230 209, 232 200 z"
        fill="#8a2a12"/>
  <!-- 上排牙 -->
  <g fill="#fff7e0">
    <path d="M 243 204 l 5 11 l 7 -9 z"/>
    <path d="M 260 208 l 5 11 l 7 -9 z"/>
    <path d="M 278 210 l 5 11 l 7 -9 z"/>
  </g>
  <!-- 下排牙 -->
  <g fill="#ffefc8">
    <path d="M 252 224 l 7 -9 l 6 11 z"/>
    <path d="M 272 228 l 7 -9 l 6 11 z"/>
  </g>
  <!-- 下顎鬚（頷下火焰短鬚） -->
  <path d="M 300 244 C 296 262, 284 272, 266 274 C 276 262, 278 252, 274 244 C 284 248, 294 248, 300 244 z"
        fill="#d99a25"/>

  <!-- 眉 + 眼（怒目，眉壓眼） -->
  <path d="M 300 154 q 22 -12 42 -2" fill="none" stroke="#7a3a10" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="324" cy="170" rx="13" ry="9" fill="#fff2cc" stroke="#7a2d10" stroke-width="3"/>
  <circle cx="319" cy="171" r="5" fill="#2a1204"/>
  <circle cx="321" cy="168.5" r="1.8" fill="#fff"/>

  <!-- 鬚（長鬚兩對，向珠方向流動） -->
  <g fill="none" stroke="#ffd968" stroke-width="3.5" stroke-linecap="round">
    <path d="M 232 144 C 202 132, 176 136, 158 154 C 146 166, 142 182, 148 198"/>
    <path d="M 228 172 C 200 172, 178 184, 166 206 C 158 220, 160 236, 170 246"/>
  </g>
  <g fill="none" stroke="#e8b840" stroke-width="3" stroke-linecap="round">
    <path d="M 252 214 C 234 230, 226 250, 232 272 C 236 284, 246 292, 258 294"/>
  </g>

  <!-- 龍珠（火焰珠；置於鬚所環抱處） -->
  <circle cx="188" cy="286" r="36" fill="url(#pearl)"/>
  <circle cx="188" cy="286" r="36" fill="none" stroke="#ffb347" stroke-width="3" opacity="0.8"/>
  <path d="M 188 240 C 197 254, 195 266, 188 272 C 181 266, 179 254, 188 240 z" fill="#ff8c42"/>
  <path d="M 156 260 C 169 264, 175 272, 175 281 C 166 278, 158 271, 156 260 z" fill="#ff8c42" opacity="0.9"/>
  <path d="M 220 260 C 207 264, 201 272, 201 281 C 210 278, 218 271, 220 260 z" fill="#ff8c42" opacity="0.9"/>

  <!-- 角落雲紋（傳統螺旋雲） -->
  <g fill="none" stroke="#2e4468" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <path d="M 62 118 q 16 -22 40 -12 q 14 6 12 22 q -2 12 -14 12 q -10 0 -10 -10 q 0 -8 8 -8"/>
    <path d="M 396 452 q 16 -22 40 -12 q 14 6 12 22 q -2 12 -14 12 q -10 0 -10 -10"/>
  </g>
</svg>
